<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login · LG Buscador</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/main.css" />
  </head>
  <body class="bg-light">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
      <form class="card shadow-sm border-0 p-4 w-100" style="max-width: 380px" id="form-login">
        <div class="d-flex align-items-center justify-content-center gap-2 mb-4">
          <svg class="lg-logo" viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="24" cy="24" r="24" fill="#a50034" />
            <text
              x="24"
              y="29"
              text-anchor="middle"
              fill="#fff"
              font-size="16"
              font-family="Arial, sans-serif"
              font-weight="700"
            >
              LG
            </text>
          </svg>
          <h1 class="h4 mb-0 fw-bold">Buscador</h1>
        </div>

        <p class="text-danger text-center small mb-3" id="login-error"></p>

        <div class="mb-3">
          <label class="form-label" for="user">Usuario</label>
          <input class="form-control" id="user" name="user" type="text" value="" required />
        </div>

        <div class="mb-3">
          <label class="form-label" for="pass">Contraseña</label>
          <input
            class="form-control"
            id="pass"
            name="pass"
            type="password"
            value=""
            required
          />
        </div>

        <button class="btn btn-lg-red w-100" type="submit" id="btn-login">
          <i class="bi bi-box-arrow-in-right me-1"></i>
          Entrar
        </button>
      </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/datos.js"></script>
    <script>
      (async function () {
        if (haySesion()) {
          var yaHay = await hayDatosEnNavegador();
          if (yaHay) {
            window.location.href = APP_CONFIG.routes.home;
            return;
          }
        }

        var form = document.getElementById("form-login");
        var errorEl = document.getElementById("login-error");
        var btn = document.getElementById("btn-login");

        form.addEventListener("submit", async function (ev) {
          ev.preventDefault();
          errorEl.textContent = "";
          btn.disabled = true;
          btn.innerHTML =
            '<span class="spinner-border spinner-border-sm me-1"></span> Entrando...';

          var user = document.getElementById("user").value;
          var pass = document.getElementById("pass").value;

          try {
            var result = await login(user, pass);
            if (!result || !result.ok) {
              errorEl.textContent =
                (result && result.error) || "Usuario o contraseña incorrectos";
              return;
            }

            btn.innerHTML =
              '<span class="spinner-border spinner-border-sm me-1"></span> Cargando datos...';
            await traerYGuardarDatos();

            window.location.href = APP_CONFIG.routes.home;
          } catch (err) {
            errorEl.textContent =
              err.message || "No se pudo conectar. Revisa Apps Script.";
            console.error(err);
          } finally {
            btn.disabled = false;
            btn.innerHTML =
              '<i class="bi bi-box-arrow-in-right me-1"></i> Entrar';
          }
        });
      })();
    </script>
  </body>
</html>
