<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LG Buscador</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/main.css" />
  </head>
  <body class="app-shell app-home">
    <header class="app-header">
      <div class="header-bar">
        <div class="header-brand">
          <button class="btn btn-icon" type="button" id="btn-menu" aria-label="Menú">
            <i class="bi bi-list"></i>
          </button>
          <svg class="lg-logo" viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="24" cy="24" r="24" fill="#a50034" />
            <text
              x="24"
              y="29"
              text-anchor="middle"
              fill="#fff"
              font-size="16"
              font-family="Arial, sans-serif"
              font-weight="700"
            >
              LG
            </text>
          </svg>
          <span class="header-title">Buscador</span>
        </div>

        <div class="header-tools">
          <div class="search-wrap">
            <i class="bi bi-search search-ico"></i>
            <input
              type="search"
              class="form-control search-input"
              id="input-buscar"
              placeholder="Buscar modelo..."
              autocomplete="off"
            />
            <button
              class="btn btn-icon btn-filter"
              type="button"
              id="btn-abrir-filtros"
              title="Filtros"
            >
              <i class="bi bi-funnel"></i>
            </button>
          </div>
          <button
            class="btn btn-icon btn-refresh"
            type="button"
            id="btn-refresh"
            aria-label="Actualizar"
            title="Actualizar"
          >
            <i class="bi bi-arrow-clockwise"></i>
          </button>
        </div>
      </div>
      <div class="header-chips">
        <div class="chips-filtros d-flex flex-wrap gap-2" id="chips-filtros"></div>
      </div>
    </header>

    <main class="home-main">
      <div id="estado" class="text-center text-muted py-5" hidden></div>
      <div id="lista-buscador" class="lista-buscador"></div>
    </main>

    <div class="offcanvas offcanvas-end" tabindex="-1" id="panel-filtros">
      <div class="offcanvas-header border-bottom">
        <h5 class="offcanvas-title" id="titulo-panel-filtros">Filter</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
      </div>
      <div class="offcanvas-body p-0" id="cuerpo-panel-filtros">
        <div id="vista-filtros-lista">
          <button
            type="button"
            class="list-group-item list-group-item-action d-flex justify-content-between align-items-center border-0 border-bottom rounded-0 px-3 py-3"
            id="btn-filtro-stock"
          >
            Stock Estado
            <i class="bi bi-chevron-right text-muted"></i>
          </button>
        </div>
        <div id="vista-filtro-stock" class="d-none px-3 py-3">
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="chk-con-stock" />
            <label class="form-check-label" for="chk-con-stock">Con Stock</label>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="chk-sin-stock" />
            <label class="form-check-label" for="chk-sin-stock">Sin Stock</label>
          </div>
        </div>
      </div>
      <div class="offcanvas-footer border-top d-flex justify-content-between px-3 py-3">
        <button type="button" class="btn btn-link text-secondary text-decoration-none" id="btn-clear-filtros">
          CLEAR
        </button>
        <button type="button" class="btn btn-link text-decoration-none btn-done-filtro" id="btn-done-filtros">
          DONE
        </button>
      </div>
    </div>

    <nav class="app-bottom d-flex align-items-center justify-content-center" aria-label="Navegación">
      <a class="nav-link text-center active" href="#">
        <i class="bi bi-grid-fill"></i>
        Buscador
      </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/datos.js"></script>
    <script src="js/lista_home.js"></script>
    <script src="js/buscador.js"></script>
    <script>
      (async function () {
        if (!exigirSesion()) return;

        var estado = document.getElementById("estado");
        var lista = document.getElementById("lista-buscador");
        var inputBuscar = document.getElementById("input-buscar");
        var chips = document.getElementById("chips-filtros");
        var panelEl = document.getElementById("panel-filtros");
        var panel = new bootstrap.Offcanvas(panelEl);
        var vistaLista = document.getElementById("vista-filtros-lista");
        var vistaStock = document.getElementById("vista-filtro-stock");
        var tituloPanel = document.getElementById("titulo-panel-filtros");
        var chkCon = document.getElementById("chk-con-stock");
        var chkSin = document.getElementById("chk-sin-stock");

        function pintar(opts) {
          opts = opts || {};
          poner_texto_busqueda(inputBuscar.value);
          listar_datos_home();
          pintar_chips();
          ajustar_altura_header();
          guardar_filtros_home();
          if (opts.irArriba) {
            window.scrollTo(0, 0);
          }
        }

        function ajustar_altura_header() {
          var header = document.querySelector(".app-header");
          if (!header) return;
          var h = Math.ceil(header.getBoundingClientRect().height);
          document.body.style.setProperty("--header-h", h + "px");
        }

        function pintar_chips() {
          var html = "";
          var chipStock = texto_chip_stock();
          if (chipStock) {
            html +=
              '<span class="chip-filtro">' +
              chipStock +
              ' <button type="button" class="btn-cerrar-chip" id="chip-quitar-stock" aria-label="Quitar">&times;</button></span>';
          }
          chips.innerHTML = html;
          var btnQuitar = document.getElementById("chip-quitar-stock");
          if (btnQuitar) {
            btnQuitar.addEventListener("click", function (ev) {
              ev.stopPropagation();
              poner_filtro_stock("");
              chkCon.checked = false;
              chkSin.checked = false;
              pintar({ irArriba: true });
            });
          }
        }

        function mostrarVistaFiltros() {
          vistaLista.classList.remove("d-none");
          vistaStock.classList.add("d-none");
          tituloPanel.textContent = "Filter";
        }

        function mostrarVistaStock() {
          vistaLista.classList.add("d-none");
          vistaStock.classList.remove("d-none");
          tituloPanel.textContent = "Stock Estado";
          chkCon.checked = filtros.stock === "con";
          chkSin.checked = filtros.stock === "sin";
        }

        async function actualizarDesdeServidor() {
          estado.hidden = false;
          lista.hidden = true;
          estado.textContent = "Actualizando desde el Sheet...";

          try {
            await traerYGuardarDatos();
            pintar({ irArriba: true });
            estado.hidden = true;
            lista.hidden = false;
          } catch (err) {
            console.error(err);
            estado.textContent = err.message || "No se pudo actualizar.";
          }
        }

        /* Restaurar búsqueda/filtros al volver de detalles */
        var scrollGuardado = restaurar_filtros_home();
        inputBuscar.value = filtros.texto || "";
        chkCon.checked = filtros.stock === "con";
        chkSin.checked = filtros.stock === "sin";

        /* Carga local rápida: no bloquear con "Cargando..." si hay datos */
        lista.hidden = false;
        estado.hidden = true;
        await cargarDatosEnMemoria();

        if (!hayDatosGuardados()) {
          estado.hidden = false;
          lista.hidden = true;
          estado.textContent =
            "No hay datos. Pulsa actualizar o vuelve a entrar.";
        } else {
          pintar({ irArriba: false });
          if (scrollGuardado > 0) {
            requestAnimationFrame(function () {
              window.scrollTo(0, scrollGuardado);
            });
          }
        }

        document.getElementById("btn-refresh").addEventListener("click", function () {
          actualizarDesdeServidor();
        });

        inputBuscar.addEventListener("input", function () {
          pintar({ irArriba: true });
        });

        document.getElementById("btn-abrir-filtros").addEventListener("click", function () {
          mostrarVistaFiltros();
          panel.show();
        });

        document.getElementById("btn-filtro-stock").addEventListener("click", function () {
          mostrarVistaStock();
        });

        chkCon.addEventListener("change", function () {
          if (chkCon.checked) chkSin.checked = false;
          sincronizar_filtro_stock_desde_checks();
          pintar({ irArriba: true });
        });
        chkSin.addEventListener("change", function () {
          if (chkSin.checked) chkCon.checked = false;
          sincronizar_filtro_stock_desde_checks();
          pintar({ irArriba: true });
        });

        function sincronizar_filtro_stock_desde_checks() {
          if (chkCon.checked) poner_filtro_stock("con");
          else if (chkSin.checked) poner_filtro_stock("sin");
          else poner_filtro_stock("");
        }

        document.getElementById("btn-clear-filtros").addEventListener("click", function () {
          if (!vistaStock.classList.contains("d-none")) {
            chkCon.checked = false;
            chkSin.checked = false;
            poner_filtro_stock("");
          } else {
            limpiar_filtros();
            inputBuscar.value = "";
            chkCon.checked = false;
            chkSin.checked = false;
          }
          pintar({ irArriba: true });
        });

        document.getElementById("btn-done-filtros").addEventListener("click", function () {
          if (!vistaStock.classList.contains("d-none")) {
            sincronizar_filtro_stock_desde_checks();
            mostrarVistaFiltros();
          }
          pintar({ irArriba: true });
          panel.hide();
        });

        document.getElementById("btn-menu").addEventListener("click", async function () {
          if (confirm("¿Cerrar sesión?")) {
            borrar_filtros_home_guardados();
            await cerrarSesion();
            window.location.href = APP_CONFIG.routes.login;
          }
        });

        /* Un solo clic en la tarjeta → detalles */
        lista.addEventListener("click", function (ev) {
          var art = ev.target.closest("article.item-modelo");
          if (!art) return;
          var tech = art.getAttribute("data-tech") || "";
          var pos = art.getAttribute("data-pos") || "0";
          if (!tech) return;
          poner_texto_busqueda(inputBuscar.value);
          guardar_filtros_home();
          window.location.href =
            APP_CONFIG.routes.detalles +
            "?modelo=" +
            encodeURIComponent(tech) +
            "&pos=" +
            encodeURIComponent(pos);
        });
      })();
    </script>
  </body>
</html>
