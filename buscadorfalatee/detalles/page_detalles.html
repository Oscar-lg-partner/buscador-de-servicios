<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalles · LG Buscador</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/main.css" />
  </head>
  <body class="app-shell">
    <header class="app-header">
      <div class="header-top">
        <div class="d-flex align-items-center gap-2">
          <a class="btn btn-icon" href="../home/page_home.html" aria-label="Volver">
            <i class="bi bi-chevron-left"></i>
          </a>
          <svg class="lg-logo" viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="24" cy="24" r="24" fill="#a50034" />
            <text
              x="24"
              y="29"
              text-anchor="middle"
              fill="#fff"
              font-size="16"
              font-family="Arial, sans-serif"
              font-weight="700"
            >
              LG
            </text>
          </svg>
          <span class="header-title">Detalles</span>
        </div>
        <button
          class="btn btn-icon"
          type="button"
          id="btn-refresh-detalle"
          aria-label="Actualizar"
        >
          <i class="bi bi-arrow-clockwise"></i>
        </button>
      </div>
    </header>

    <main class="detalle-layout">
      <button type="button" class="btn-nav-detalle" id="btn-detalle-prev" aria-label="Anterior">
        <i class="bi bi-chevron-left"></i>
      </button>

      <div id="caja-detalle" class="caja-detalle"></div>

      <button type="button" class="btn-nav-detalle" id="btn-detalle-next" aria-label="Siguiente">
        <i class="bi bi-chevron-right"></i>
      </button>
    </main>

    <nav class="app-bottom d-flex align-items-center justify-content-center" aria-label="Navegación">
      <a class="nav-link text-center" href="../home/page_home.html">
        <i class="bi bi-grid-fill"></i>
        Buscador
      </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/datos.js"></script>
    <script src="js/lista_detalles.js"></script>
    <script>
      (async function () {
        if (!exigirSesion()) return;

        var params = new URLSearchParams(window.location.search);
        var tech = params.get("modelo") || "";
        var pos = Number(params.get("pos") || 0);
        if (isNaN(pos) || pos < 0) pos = 0;

        var bolsa = null;

        function pintar() {
          if (!bolsa) return;
          if (pos < 0) pos = 0;
          if (pos >= bolsa.total_datos) pos = Math.max(0, bolsa.total_datos - 1);
          pintar_detalle(bolsa, pos);
          document.getElementById("btn-detalle-prev").disabled = pos <= 0;
          document.getElementById("btn-detalle-next").disabled =
            pos >= bolsa.total_datos - 1;
        }

        await cargarDatosEnMemoria();

        if (!tech) {
          document.getElementById("caja-detalle").innerHTML =
            '<p class="text-center text-muted py-4">No se indicó modelo. Vuelve al buscador.</p>';
          return;
        }

        bolsa = crear_bolsa_detalle(tech);
        pintar();

        document.getElementById("btn-detalle-prev").addEventListener("click", function () {
          pos = pos - 1;
          pintar();
        });

        document.getElementById("btn-detalle-next").addEventListener("click", function () {
          pos = pos + 1;
          pintar();
        });

        document
          .getElementById("btn-refresh-detalle")
          .addEventListener("click", async function () {
            try {
              await traerYGuardarDatos();
              bolsa = crear_bolsa_detalle(tech);
              pintar();
            } catch (err) {
              console.error(err);
              alert(err.message || "No se pudo actualizar");
            }
          });
      })();
    </script>
  </body>
</html>
