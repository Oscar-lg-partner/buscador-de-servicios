<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ficha · LG Buscador</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/main.css?v=20261030c" />
    <!-- Tema claro/oscuro: antes de pintar para que no parpadee -->
    <script src="../../js/tema.js?v=20261030c"></script>
  </head>
  <body class="app-detalle">
    <header class="barra-sup">
      <div class="barra-fila">
        <a class="btn" href="../home/page_home.html" id="btn-volver">
          <i class="bi bi-arrow-left" aria-hidden="true"></i> Buscador
        </a>
        <div class="sesion">
          <button class="btn btn-icono btn-texto btn-tema" type="button" data-accion-tema="alternar" aria-label="Cambiar tema"></button>
          <div class="datos-estado">
            <button class="btn btn-icono" type="button" id="btn-refresh-detalle" aria-label="Actualizar datos" title="Actualizar datos">
              <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="detalle-main">
      <div id="caja-detalle" class="ficha"></div>
    </main>

    <script src="../../js/config.js?v=20261030c"></script>
    <script src="../../js/api.js?v=20261030c"></script>
    <script src="../../js/auth.js?v=20261030c"></script>
    <script src="../../js/datos.js?v=20261030c"></script>
    <script src="../../js/formato.js?v=20261030c"></script>
    <script src="js/lista_detalles.js?v=20261030c"></script>
    <script>
      (async function () {
        if (!exigirSesion()) return;

        var caja = document.getElementById("caja-detalle");
        var params = new URLSearchParams(window.location.search);
        var tech = params.get("modelo") || "";
        var pos = Number(params.get("pos") || 0);
        if (isNaN(pos) || pos < 0) pos = 0;

        var bolsa = null;

        function pintar() {
          if (!bolsa) return;
          if (pos < 0) pos = 0;
          if (pos >= bolsa.total_datos) pos = Math.max(0, bolsa.total_datos - 1);
          pintar_detalle(bolsa, pos, caja);
        }

        activar_ficha_det(caja, function (paso) {
          pos = pos + paso;
          pintar();
        });

        /* ← / → cambian de servicio; Esc vuelve al buscador */
        document.addEventListener("keydown", function (ev) {
          if (ev.key === "ArrowLeft") {
            pos = pos - 1;
            pintar();
          } else if (ev.key === "ArrowRight") {
            pos = pos + 1;
            pintar();
          } else if (ev.key === "Escape") {
            window.location.href = APP_CONFIG.routes.home;
          }
        });

        await cargarDatosEnMemoria();

        if (!tech) {
          caja.innerHTML =
            '<div class="estado"><p class="estado-titulo">Falta el modelo</p>' +
            "<p>Vuelve al buscador y elige un modelo de la lista.</p></div>";
          return;
        }

        bolsa = crear_bolsa_detalle(tech);
        pintar();

        document
          .getElementById("btn-refresh-detalle")
          .addEventListener("click", async function () {
            try {
              await traerYGuardarDatos();
              bolsa = crear_bolsa_detalle(tech);
              pintar();
            } catch (err) {
              console.error(err);
              alert(err.message || "No se pudo actualizar");
            }
          });
      })();
    </script>
  </body>
</html>
