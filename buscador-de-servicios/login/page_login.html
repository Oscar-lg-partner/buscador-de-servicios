<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login · LG Buscador</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/main.css?v=20261030c" />
    <!-- Tema claro/oscuro: antes de pintar para que no parpadee -->
    <script src="../../js/tema.js?v=20261030c"></script>
  </head>
  <body class="app-login">
    <form class="login-caja" id="form-login">
      <div class="marca">
        <svg class="lg-logo" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="24" fill="#a50034" />
          <text x="24" y="29" text-anchor="middle" fill="#fff" font-size="16" font-family="Arial, sans-serif" font-weight="700">LG</text>
        </svg>
        Buscador
      </div>
      <p class="login-sub">Entra con tu usuario del call center.</p>

      <p class="login-error" id="login-error" role="alert"></p>

      <label class="campo">
        <span>Usuario</span>
        <input id="user" name="user" type="text" autocomplete="username" required autofocus />
      </label>

      <label class="campo">
        <span>Contraseña</span>
        <input id="pass" name="pass" type="password" autocomplete="current-password" required />
      </label>

      <button class="btn btn-principal" type="submit" id="btn-login">Entrar</button>
    </form>

    <script src="../../js/config.js?v=20261030c"></script>
    <script src="../../js/api.js?v=20261030c"></script>
    <script src="../../js/auth.js?v=20261030c"></script>
    <script src="../../js/datos.js?v=20261030c"></script>
    <script>
      (async function () {
        if (haySesion()) {
          var yaHay = await hayDatosEnNavegador();
          if (yaHay) {
            window.location.href = APP_CONFIG.routes.home;
            return;
          }
        }

        var form = document.getElementById("form-login");
        var errorEl = document.getElementById("login-error");
        var btn = document.getElementById("btn-login");

        form.addEventListener("submit", async function (ev) {
          ev.preventDefault();
          errorEl.textContent = "";
          btn.disabled = true;
          btn.innerHTML =
            '<span class="girando" aria-hidden="true"></span> Entrando…';

          var user = document.getElementById("user").value;
          var pass = document.getElementById("pass").value;

          try {
            var result = await login(user, pass);
            if (!result || !result.ok) {
              errorEl.textContent =
                (result && result.error) || "Usuario o contraseña incorrectos";
              return;
            }

            btn.innerHTML =
              '<span class="girando" aria-hidden="true"></span> Trayendo datos del Sheet…';
            await traerYGuardarDatos();

            window.location.href = APP_CONFIG.routes.home;
          } catch (err) {
            errorEl.textContent =
              err.message || "No se pudo conectar. Revisa Apps Script.";
            console.error(err);
          } finally {
            btn.disabled = false;
            btn.textContent = "Entrar";
          }
        });
      })();
    </script>
  </body>
</html>
