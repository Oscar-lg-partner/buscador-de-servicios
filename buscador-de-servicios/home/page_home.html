<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LG Buscador</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/main.css" />
  </head>
  <body class="app-shell app-home">
    <header class="app-header">
      <div class="header-bar">
        <div class="header-brand">
          <button class="btn btn-icon" type="button" id="btn-menu" aria-label="Menú">
            <i class="bi bi-list"></i>
          </button>
          <svg class="lg-logo" viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="24" cy="24" r="24" fill="#a50034" />
            <text
              x="24"
              y="29"
              text-anchor="middle"
              fill="#fff"
              font-size="16"
              font-family="Arial, sans-serif"
              font-weight="700"
            >
              LG
            </text>
          </svg>
          <span class="header-title">Buscador</span>
        </div>

        <div class="header-tools">
          <div class="search-wrap">
            <i class="bi bi-search search-ico"></i>
            <input
              type="search"
              class="form-control search-input"
              id="input-buscar"
              placeholder="Buscar modelo, año, precio, servicio..."
              autocomplete="off"
            />
            <button
              class="btn btn-icon btn-filter"
              type="button"
              id="btn-abrir-filtros"
              title="Filtros"
            >
              <i class="bi bi-funnel"></i>
            </button>
          </div>
          <button
            class="btn btn-icon btn-refresh"
            type="button"
            id="btn-refresh"
            aria-label="Actualizar"
            title="Actualizar"
          >
            <i class="bi bi-arrow-clockwise"></i>
          </button>
        </div>
      </div>
      <div class="header-chips">
        <div class="chips-filtros d-flex flex-wrap gap-2" id="chips-filtros"></div>
      </div>
    </header>

    <main class="home-main">
      <div id="estado" class="text-center text-muted py-5" hidden></div>
      <div id="lista-buscador" class="lista-buscador"></div>
    </main>

    <div class="offcanvas offcanvas-end" tabindex="-1" id="panel-filtros">
      <div class="offcanvas-header border-bottom">
        <h5 class="offcanvas-title" id="titulo-panel-filtros">Filter</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
      </div>
      <div class="offcanvas-body p-0" id="cuerpo-panel-filtros">
        <div id="vista-filtros-lista">
          <button
            type="button"
            class="list-group-item list-group-item-action d-flex justify-content-between align-items-center border-0 border-bottom rounded-0 px-3 py-3"
            id="btn-filtro-stock"
          >
            Stock Estado
            <i class="bi bi-chevron-right text-muted"></i>
          </button>
          <button
            type="button"
            class="list-group-item list-group-item-action d-flex justify-content-between align-items-center border-0 border-bottom rounded-0 px-3 py-3"
            id="btn-filtro-renovacion"
          >
            Renovación
            <i class="bi bi-chevron-right text-muted"></i>
          </button>
          <button
            type="button"
            class="list-group-item list-group-item-action d-flex justify-content-between align-items-center border-0 border-bottom rounded-0 px-3 py-3"
            id="btn-filtro-cp"
          >
            CP
            <i class="bi bi-chevron-right text-muted"></i>
          </button>
        </div>
        <div id="vista-filtro-stock" class="d-none px-3 py-3">
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="chk-con-stock" />
            <label class="form-check-label" for="chk-con-stock">Con Stock</label>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="chk-sin-stock" />
            <label class="form-check-label" for="chk-sin-stock">Sin Stock</label>
          </div>
        </div>
        <div id="vista-filtro-renovacion" class="d-none px-3 py-3">
          <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" id="chk-con-renovacion" />
            <label class="form-check-label" for="chk-con-renovacion">Con renovación</label>
          </div>
          <div class="mb-3 ps-4">
            <label class="form-label small text-muted mb-1" for="sel-renovacion-num">Nº de renovación</label>
            <select class="form-select form-select-sm" id="sel-renovacion-num">
              <option value="">Todas</option>
            </select>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="chk-sin-renovacion" />
            <label class="form-check-label" for="chk-sin-renovacion">Sin renovación</label>
          </div>
        </div>
        <div id="vista-filtro-cp" class="d-none px-3 py-3">
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="chk-con-cp" />
            <label class="form-check-label" for="chk-con-cp">Con Código Postal</label>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="chk-sin-cp" />
            <label class="form-check-label" for="chk-sin-cp">Sin Código Postal</label>
          </div>
        </div>
      </div>
      <div class="offcanvas-footer border-top d-flex justify-content-between px-3 py-3">
        <button type="button" class="btn btn-link text-secondary text-decoration-none" id="btn-clear-filtros">
          CLEAR
        </button>
        <button type="button" class="btn btn-link text-decoration-none btn-done-filtro" id="btn-done-filtros">
          DONE
        </button>
      </div>
    </div>

    <nav class="app-bottom d-flex align-items-center justify-content-center" aria-label="Navegación">
      <a class="nav-link text-center active" href="#">
        <i class="bi bi-grid-fill"></i>
        Buscador
      </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/datos.js"></script>
    <script src="js/lista_home.js"></script>
    <script src="js/buscador.js"></script>
    <script>
      (async function () {
        if (!exigirSesion()) return;

        var estado = document.getElementById("estado");
        var lista = document.getElementById("lista-buscador");
        var inputBuscar = document.getElementById("input-buscar");
        var chips = document.getElementById("chips-filtros");
        var panelEl = document.getElementById("panel-filtros");
        var panel = new bootstrap.Offcanvas(panelEl);
        var vistaLista = document.getElementById("vista-filtros-lista");
        var tituloPanel = document.getElementById("titulo-panel-filtros");
        var chkCon = document.getElementById("chk-con-stock");
        var chkSin = document.getElementById("chk-sin-stock");
        var chkConReno = document.getElementById("chk-con-renovacion");
        var chkSinReno = document.getElementById("chk-sin-renovacion");
        var selRenoNum = document.getElementById("sel-renovacion-num");
        var chkConCp = document.getElementById("chk-con-cp");
        var chkSinCp = document.getElementById("chk-sin-cp");

        /* Sub-vistas del panel: "" = lista de filtros */
        var vistas = {
          stock: document.getElementById("vista-filtro-stock"),
          renovacion: document.getElementById("vista-filtro-renovacion"),
          cp: document.getElementById("vista-filtro-cp"),
        };
        var titulosVista = {
          stock: "Stock Estado",
          renovacion: "Renovación",
          cp: "CP",
        };
        var vistaActual = "";

        function pintar(opts) {
          opts = opts || {};
          poner_texto_busqueda(inputBuscar.value);
          listar_datos_home();
          pintar_chips();
          ajustar_altura_header();
          guardar_filtros_home();
          if (opts.irArriba) {
            window.scrollTo(0, 0);
          }
        }

        function ajustar_altura_header() {
          var header = document.querySelector(".app-header");
          if (!header) return;
          var h = Math.ceil(header.getBoundingClientRect().height);
          document.body.style.setProperty("--header-h", h + "px");
        }

        function pintar_chips() {
          var lista_chips = [
            { filtro: "stock", texto: texto_chip_stock() },
            { filtro: "renovacion", texto: texto_chip_renovacion() },
            { filtro: "cp", texto: texto_chip_cp() },
          ];
          var html = "";
          for (var i = 0; i < lista_chips.length; i++) {
            if (!lista_chips[i].texto) continue;
            html +=
              '<span class="chip-filtro">' +
              lista_chips[i].texto +
              ' <button type="button" class="btn-cerrar-chip" data-quitar="' +
              lista_chips[i].filtro +
              '" aria-label="Quitar">&times;</button></span>';
          }
          chips.innerHTML = html;
        }

        /* ✕ de cualquier chip → quita solo ese filtro */
        chips.addEventListener("click", function (ev) {
          var btn = ev.target.closest("[data-quitar]");
          if (!btn) return;
          ev.stopPropagation();
          quitar_filtro(btn.getAttribute("data-quitar"));
          sincronizar_checks_desde_filtros();
          pintar({ irArriba: true });
        });

        function quitar_filtro(nombre) {
          if (nombre === "stock") poner_filtro_stock("");
          if (nombre === "renovacion") poner_filtro_renovacion("");
          if (nombre === "cp") poner_filtro_cp("");
        }

        /** Casillas y desplegable reflejan el estado de `filtros` */
        function sincronizar_checks_desde_filtros() {
          chkCon.checked = filtros.stock === "con";
          chkSin.checked = filtros.stock === "sin";
          chkConReno.checked = filtros.renovacion === "con";
          chkSinReno.checked = filtros.renovacion === "sin";
          selRenoNum.value = filtros.renovacion_num || "";
          selRenoNum.disabled = filtros.renovacion !== "con";
          chkConCp.checked = filtros.cp === "con";
          chkSinCp.checked = filtros.cp === "sin";
        }

        /** Rellena el desplegable con los nº de renovación que hay en los datos */
        function rellenar_opciones_renovacion() {
          var nums = opciones_renovacion(datos_necesarios().items);
          var actual = filtros.renovacion_num || "";
          if (actual && nums.indexOf(actual) === -1) nums.push(actual);
          var html = '<option value="">Todas</option>';
          for (var i = 0; i < nums.length; i++) {
            html +=
              '<option value="' + escapar(nums[i]) + '">' + escapar(nums[i]) + "</option>";
          }
          selRenoNum.innerHTML = html;
        }

        function mostrarVista(nombre) {
          vistaActual = nombre || "";
          vistaLista.classList.toggle("d-none", vistaActual !== "");
          for (var k in vistas) {
            vistas[k].classList.toggle("d-none", k !== vistaActual);
          }
          tituloPanel.textContent = vistaActual ? titulosVista[vistaActual] : "Filter";
          if (vistaActual === "renovacion") rellenar_opciones_renovacion();
          sincronizar_checks_desde_filtros();
        }

        function mostrarVistaFiltros() {
          mostrarVista("");
        }

        async function actualizarDesdeServidor() {
          estado.hidden = false;
          lista.hidden = true;
          estado.textContent = "Actualizando desde el Sheet...";

          try {
            await traerYGuardarDatos();
            pintar({ irArriba: true });
            estado.hidden = true;
            lista.hidden = false;
          } catch (err) {
            console.error(err);
            estado.textContent = err.message || "No se pudo actualizar.";
          }
        }

        /* Restaurar búsqueda/filtros al volver de detalles */
        var scrollGuardado = restaurar_filtros_home();
        inputBuscar.value = filtros.texto || "";
        sincronizar_checks_desde_filtros();

        /* Carga local rápida: no bloquear con "Cargando..." si hay datos */
        lista.hidden = false;
        estado.hidden = true;
        await cargarDatosEnMemoria();

        if (!hayDatosGuardados()) {
          estado.hidden = false;
          lista.hidden = true;
          estado.textContent =
            "No hay datos. Pulsa actualizar o vuelve a entrar.";
        } else {
          pintar({ irArriba: false });
          if (scrollGuardado > 0) {
            requestAnimationFrame(function () {
              window.scrollTo(0, scrollGuardado);
            });
          }
        }

        document.getElementById("btn-refresh").addEventListener("click", function () {
          actualizarDesdeServidor();
        });

        /* Espera a que deje de escribir (200 ms) antes de repintar */
        var timerBuscar = null;
        inputBuscar.addEventListener("input", function () {
          clearTimeout(timerBuscar);
          timerBuscar = setTimeout(function () {
            pintar({ irArriba: true });
          }, 200);
        });

        document.getElementById("btn-abrir-filtros").addEventListener("click", function () {
          mostrarVistaFiltros();
          panel.show();
        });

        document.getElementById("btn-filtro-stock").addEventListener("click", function () {
          mostrarVista("stock");
        });
        document.getElementById("btn-filtro-renovacion").addEventListener("click", function () {
          mostrarVista("renovacion");
        });
        document.getElementById("btn-filtro-cp").addEventListener("click", function () {
          mostrarVista("cp");
        });

        /**
         * Pareja Con / Sin: marcar una desmarca la otra.
         * aplicar(valor) recibe "con" | "sin" | "" y se aplica al momento.
         */
        function pareja_checks(chkConX, chkSinX, aplicar) {
          function cambio(marcado, otro) {
            if (marcado.checked) otro.checked = false;
            aplicar(chkConX.checked ? "con" : chkSinX.checked ? "sin" : "");
            sincronizar_checks_desde_filtros();
            pintar({ irArriba: true });
          }
          chkConX.addEventListener("change", function () {
            cambio(chkConX, chkSinX);
          });
          chkSinX.addEventListener("change", function () {
            cambio(chkSinX, chkConX);
          });
        }

        pareja_checks(chkCon, chkSin, poner_filtro_stock);
        pareja_checks(chkConReno, chkSinReno, function (valor) {
          poner_filtro_renovacion(valor, selRenoNum.value);
        });
        pareja_checks(chkConCp, chkSinCp, poner_filtro_cp);

        /* Elegir un nº de renovación marca "Con renovación" */
        selRenoNum.addEventListener("change", function () {
          poner_filtro_renovacion("con", selRenoNum.value);
          sincronizar_checks_desde_filtros();
          pintar({ irArriba: true });
        });

        document.getElementById("btn-clear-filtros").addEventListener("click", function () {
          if (vistaActual) {
            /* Dentro de un filtro → limpia solo ese */
            quitar_filtro(vistaActual);
          } else {
            limpiar_filtros();
            inputBuscar.value = "";
          }
          sincronizar_checks_desde_filtros();
          pintar({ irArriba: true });
        });

        document.getElementById("btn-done-filtros").addEventListener("click", function () {
          mostrarVistaFiltros();
          pintar({ irArriba: true });
          panel.hide();
        });

        document.getElementById("btn-menu").addEventListener("click", async function () {
          if (confirm("¿Cerrar sesión?")) {
            borrar_filtros_home_guardados();
            await cerrarSesion();
            window.location.href = APP_CONFIG.routes.login;
          }
        });

        /* Un solo clic en la tarjeta → detalles */
        lista.addEventListener("click", function (ev) {
          var art = ev.target.closest("article.item-modelo");
          if (!art) return;
          var tech = art.getAttribute("data-tech") || "";
          var pos = art.getAttribute("data-pos") || "0";
          if (!tech) return;
          poner_texto_busqueda(inputBuscar.value);
          guardar_filtros_home();
          window.location.href =
            APP_CONFIG.routes.detalles +
            "?modelo=" +
            encodeURIComponent(tech) +
            "&pos=" +
            encodeURIComponent(pos);
        });
      })();
    </script>
  </body>
</html>
